name: النشر على GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: اختبار وبناء
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت التبعيات (ملف القفل)
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: تشغيل الاختبارات
        run: npm test

      - name: بناء نسخة الإنتاج
        run: npm run build

      # حماية من تكرار المشكلة: لا يُنشر أبدًا أي ملف مصدر خام.
      # يجب أن يشير dist/index.html إلى أصول مبنية تحت /test/ فقط.
      - name: التحقق من مخرجات البناء
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html غير موجود"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::dist/.nojekyll غير موجود"; exit 1; }

          if grep -q '/src/' dist/index.html; then
            echo "::error::dist/index.html ما زال يشير إلى ملفات مصدر /src/*.tsx"
            exit 1
          fi

          if ! grep -q 'src="/test/assets/' dist/index.html; then
            echo "::error::dist/index.html لا يشير إلى أصول مبنية تحت /test/assets/"
            exit 1
          fi

          # كل أصل مشار إليه في index.html يجب أن يكون موجودًا فعليًا
          grep -oE '(src|href)="/test/[^"]+"' dist/index.html | sed -E 's/.*="\/test\/([^"]+)"/\1/' | while read -r asset; do
            test -f "dist/$asset" || { echo "::error::الأصل المفقود في dist: $asset"; exit 1; }
          done

          stray=$(find dist \( -name '*.tsx' -o -name '*.ts' \) -print -quit)
          if [ -n "$stray" ]; then
            echo "::error::تم العثور على ملف مصدر داخل dist: $stray"
            exit 1
          fi

          echo "✔ dist جاهز للنشر ويشير إلى أصول مبنية تحت /test/"

      - name: تهيئة GitHub Pages
        uses: actions/configure-pages@v5

      - name: رفع مخرجات البناء
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: نشر
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # سبب الشاشة البيضاء: كان مصدر النشر «Deploy from a branch» فيخدم المستودع
      # الخام (index.html يشير إلى /src/*.tsx) ويتجاهل مخرجات البناء.
      # هذه الخطوة تتأكد أن المصدر هو GitHub Actions (workflow) قبل النشر.
      - name: التأكد من أن مصدر النشر هو GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          set -uo pipefail
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          get_status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "$API/repos/$REPO/pages" || true)
          echo "GET /pages -> $get_status"
          cat /tmp/pages.json 2>/dev/null || true
          echo
          build_type=$(jq -r '.build_type // "unknown"' /tmp/pages.json 2>/dev/null || echo unknown)
          echo "build_type: $build_type"

          put_status="skipped"
          if [ "$build_type" != "workflow" ]; then
            put_status=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
              -H 'Content-Type: application/json' \
              "${auth[@]}" \
              -d '{"build_type":"workflow"}' \
              "$API/repos/$REPO/pages" || true)
            echo "PUT /pages -> $put_status"
            cat /tmp/put.json 2>/dev/null || true
            echo
            build_type=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/pages" | jq -r '.build_type // "unknown"')
            echo "build_type after update: $build_type"
          fi

          if [ "$build_type" != "workflow" ]; then
            body=$(tr -d '\n' < /tmp/put.json 2>/dev/null | head -c 300)
            echo "::warning::Pages source is '$build_type' (GET $get_status, PUT $put_status). The build artifact is still deployed below; switch Settings -> Pages -> Source to 'GitHub Actions' to remove the legacy build race. API response: $body"
          else
            echo "✔ مصدر النشر هو GitHub Actions"
          fi

      # لا يمكن تعديل إعدادات Pages من الـ workflow (403)، لذلك قد يبدأ
      # GitHub بناءً من الفرع (legacy) عند كل دفعة وينشر الملفات الخام بعدنا.
      # ننتظر انتهاءه أولًا حتى تكون نشرتنا (مخرجات البناء) هي الأخيرة دائمًا.
      - name: انتظار انتهاء بناء الفرع (legacy) قبل النشر
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          set -uo pipefail
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          count_legacy() {
            curl -sS "${auth[@]}" \
              "$API/repos/$REPO/actions/runs?branch=main&status=$1&per_page=100" \
              | jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | length'
          }
          for attempt in $(seq 1 36); do
            running=$(count_legacy in_progress || echo 0)
            queued=$(count_legacy queued || echo 0)
            if [ "${running:-0}" = "0" ] && [ "${queued:-0}" = "0" ]; then
              echo "✔ لا يوجد بناء فرع قيد التنفيذ — النشر الآن"
              exit 0
            fi
            echo "البناء القديم قيد التنفيذ (in_progress=$running, queued=$queued) — محاولة $attempt/36"
            sleep 5
          done
          echo "::warning::انتهت مدة الانتظار قبل انتهاء بناء الفرع؛ سيُنشر الآن على أي حال"

      - name: النشر إلى GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
