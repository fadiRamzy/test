name: النشر على GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: اختبار وبناء
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت التبعيات (ملف القفل)
        run: npm ci

      - name: فحص الأنواع
        run: npm run typecheck

      - name: تشغيل الاختبارات
        run: npm test

      - name: بناء نسخة الإنتاج
        run: npm run build

      - name: رفع مخرجات البناء
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: نشر
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر إلى GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
