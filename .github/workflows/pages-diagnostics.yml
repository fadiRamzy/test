name: تشخيص إعدادات Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Pages settings API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "== GET =="
          curl -sS -o /tmp/get.json -w 'GET status=%{http_code}\n' "${auth[@]}" "$API/repos/$REPO/pages"
          cat /tmp/get.json; echo
          echo "== PUT build_type=workflow =="
          curl -sS -o /tmp/put.json -w 'PUT status=%{http_code}\n' -X PUT "${auth[@]}" -d '{"build_type":"workflow"}' "$API/repos/$REPO/pages"
          cat /tmp/put.json; echo
          echo "== GET after =="
          curl -sS "${auth[@]}" "$API/repos/$REPO/pages" | jq -r '.build_type'
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "${auth[@]}" -d '{"build_type":"workflow"}' "$API/repos/$REPO/pages")
          body=$(cat /tmp/put.json)
          echo "::error::pages PUT status=$status body=$body"
